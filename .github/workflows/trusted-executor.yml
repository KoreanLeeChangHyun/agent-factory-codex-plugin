name: Trusted executor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: ''
      - name: Unit and native capability coverage
        run: python -m unittest tests.test_trusted_executor tests.test_agent_exec
      - name: Native launch, containment, and quiescence smoke
        run: python skills/agent/scripts/trusted_executor_native_smoke.py
      - name: Capture backend capability record
        shell: bash
        run: python skills/agent/scripts/agent_exec.py probe-executor > executor-capabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-record-${{ matrix.os }}
          path: executor-capabilities.json

  linux-strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: ''
      - name: Resolve an explicit delegated cgroup path
        shell: bash
        run: |
          delegate="/sys/fs/cgroup/agent-factory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if sudo sh -c 'echo "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control' 2>/dev/null \
             && sudo mkdir "$delegate" 2>/dev/null \
             && sudo chown "$(id -u):$(id -g)" "$delegate" \
             && test -w "$delegate/cgroup.procs" \
             && test -e "$delegate/cgroup.kill"; then
            echo "AF_CGROUP_DELEGATE=$delegate" >> "$GITHUB_ENV"
          else
            echo "Hosted runner did not provide delegatable cgroup v2 controls"
          fi
      - name: Execute strict fixture or publish fail-closed refusal
        shell: bash
        run: |
          python skills/agent/scripts/trusted_executor_native_smoke.py --strict-linux-record linux-strict-record.json
          python skills/agent/scripts/agent_exec.py probe-executor --backend linux > linux-capabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-strict-record
          path: |
            linux-capabilities.json
            linux-strict-record.json

  reproducibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: ''
      - name: Execute identical fixture from fresh source directories
        shell: bash
        run: |
          cp -a source source-a
          cp -a source source-b
          mkdir run-records
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/test-private.pem"
          openssl pkey -in "$RUNNER_TEMP/test-private.pem" -pubout -out "$RUNNER_TEMP/test-public.pem"
          image_identity="${ImageOS:-ubuntu-24.04}:${ImageVersion:-unreported}"
          export AF_RUNNER_IMAGE_DIGEST="$(printf '%s' "$image_identity" | sha256sum | cut -d' ' -f1)"
          export AF_RUNNER_SBOM_DIGEST="$(printf '%s' "${image_identity}:sbom-unavailable" | sha256sum | cut -d' ' -f1)"
          key_id="sha256:$(openssl pkey -pubin -in "$RUNNER_TEMP/test-public.pem" -outform DER | sha256sum | cut -d' ' -f1)"
          python - "$RUNNER_TEMP/verifier-policy.json" "$key_id" <<'PY'
          import json, sys
          value = {"schemaVersion":"1.0.0","expectedBuilderId":"agent-factory-ci-fixture","expectedKeyId":sys.argv[2],"minimumGrade":"best-effort-tree","allowedBackends":["linux"]}
          open(sys.argv[1], 'w', encoding='utf-8').write(json.dumps(value, sort_keys=True, separators=(',', ':')))
          PY
          set +e
          python source-a/skills/agent/scripts/trusted_executor_fixture.py --project-root source-a --run-directory source-a/.agent-factory/agent/fixture/runs/run-a --run-id run-a --private-key "$RUNNER_TEMP/test-private.pem" --public-key "$RUNNER_TEMP/test-public.pem" --policy "$RUNNER_TEMP/verifier-policy.json" --expect-refusal-record refusal-a.json
          run_a_status=$?
          python source-b/skills/agent/scripts/trusted_executor_fixture.py --project-root source-b --run-directory source-b/.agent-factory/agent/fixture/runs/run-b --run-id run-b --private-key "$RUNNER_TEMP/test-private.pem" --public-key "$RUNNER_TEMP/test-public.pem" --policy "$RUNNER_TEMP/verifier-policy.json" --expect-refusal-record refusal-b.json
          run_b_status=$?
          python - "$run_a_status" "$run_b_status" <<'PY' > comparison.json
          import hashlib, json, pathlib
          import sys
          paths = [pathlib.Path('source-a/.agent-factory/agent/fixture/runs/run-a/requested.manifest.json'), pathlib.Path('source-b/.agent-factory/agent/fixture/runs/run-b/requested.manifest.json')]
          digests = [hashlib.sha256(path.read_bytes()).hexdigest() for path in paths]
          if len(set(digests)) != 1:
              raise SystemExit('canonical requested manifests differ')
          refusal_paths = [pathlib.Path(name) for name in ('refusal-a.json', 'refusal-b.json') if pathlib.Path(name).is_file()]
          fixture_statuses = [int(value) for value in sys.argv[1:]]
          if refusal_paths:
              print(json.dumps({'status':'refused','code':'capability_unsatisfied','refusedRuns':[path.stem.removeprefix('refusal-') for path in refusal_paths],'canonicalManifestDigest':digests[0]}, sort_keys=True))
              raise SystemExit(1)
          if fixture_statuses != [0, 0]:
              print(json.dumps({'status':'incomplete','fixtureExitCodes':fixture_statuses,'canonicalManifestDigest':digests[0]}, sort_keys=True))
              raise SystemExit(1)
          print(json.dumps({'status':'ready','canonicalManifestDigest':digests[0]}, sort_keys=True))
          PY
          comparison_status=$?
          cp comparison.json run-records/
          cp refusal-*.json run-records/ 2>/dev/null || true
          if (( comparison_status != 0 )); then
            exit "$comparison_status"
          fi
          python source/skills/agent/scripts/agent_exec.py compare-executions \
            --left-manifest source-a/.agent-factory/agent/fixture/runs/run-a/execution.manifest.json \
            --right-manifest source-b/.agent-factory/agent/fixture/runs/run-b/execution.manifest.json \
            --left-index source-a/.agent-factory/agent/fixture/runs/run-a/artifact.index.json \
            --right-index source-b/.agent-factory/agent/fixture/runs/run-b/artifact.index.json \
            > run-records/comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reproducibility-run-records
          path: run-records
