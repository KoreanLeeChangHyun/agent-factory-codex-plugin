<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Agent Factory Specification</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="specification-shell" data-specification-shell>
      <nav class="activity-bar" aria-label="작업 표시줄" data-region="activity-bar">
        <button
          class="activity-button is-active"
          type="button"
          aria-label="탐색기"
          aria-pressed="true"
          data-activity="explorer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4.5 3.5h5l2 2h8v15h-15v-17Z" />
            <path d="M4.5 8h15" />
          </svg>
        </button>
        <button
          class="activity-button"
          type="button"
          aria-label="기획"
          aria-pressed="false"
          data-activity="planning"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 3.5h9l3 3v14H6v-17Z" />
            <path d="M15 3.5v3h3M9 11h6M9 15h6" />
          </svg>
        </button>
        <button
          class="activity-button"
          type="button"
          aria-label="스킬"
          aria-pressed="false"
          data-activity="skills"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m12 3 2.1 4.9L19 10l-4.9 2.1L12 17l-2.1-4.9L5 10l4.9-2.1L12 3Z" />
            <path d="m18.5 16 .8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8.8-1.7Z" />
          </svg>
        </button>
      </nav>

      <aside
        class="primary-sidebar"
        aria-label="현재 작업 영역의 기본 사이드바"
        data-region="primary-sidebar"
        data-sidebar-host
      >
        <header class="primary-sidebar__header" data-sidebar-title>탐색기</header>
        <div class="primary-sidebar__content" data-sidebar-content>
          <div class="sidebar-view" data-sidebar-view="explorer">
            <div
              class="explorer-tree"
              role="tree"
              aria-label="현재 작업 영역 탐색기"
              data-explorer-content
            ></div>
          </div>
          <div class="sidebar-view" data-sidebar-view="planning" hidden>
            <a href="/planning/agent-factory-core/">Agent Factory 코어</a>
          </div>
          <div class="sidebar-view" data-sidebar-view="skills" hidden>
            <p class="empty-state">표시할 프로젝트 스킬이 없습니다.</p>
          </div>
        </div>
      </aside>

      <div
        class="sidebar-resizer"
        role="separator"
        aria-label="기본 사이드바 너비 조절"
        aria-orientation="vertical"
        aria-valuemin="180"
        aria-valuemax="520"
        aria-valuenow="288"
        tabindex="0"
        data-sidebar-resizer
      ></div>

      <main class="workspace" aria-label="작업영역" data-region="workspace">
        <section class="workspace-view" data-workspace-view="explorer">
          <p class="empty-state">탐색기에서 항목을 선택하세요.</p>
        </section>
        <section class="workspace-view" data-workspace-view="planning" hidden>
          <p class="empty-state">왼쪽에서 Human 정제 문서를 선택하세요.</p>
        </section>
        <section class="workspace-view" data-workspace-view="skills" hidden>
          <p class="empty-state">열린 프로젝트 스킬이 없습니다.</p>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
