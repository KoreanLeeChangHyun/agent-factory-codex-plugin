<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Factory Project</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <p class="eyebrow">Agent Factory</p>
      <h1>Project View</h1>
      <p id="project-root" class="muted"></p>
    </header>
    <main>
      <section>
        <h2>Git progress</h2>
        <div id="git" class="grid"></div>
      </section>
      <section>
        <h2>Project Skill</h2>
        <pre id="skill"></pre>
      </section>
      <section>
        <h2>References</h2>
        <div id="references" class="stack"></div>
      </section>
      <section>
        <h2>Diagrams</h2>
        <div id="diagrams" class="stack"></div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
